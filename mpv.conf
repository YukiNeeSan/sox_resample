#
# THIS FILE WILL BE OVERWRITTEN WITH THE PACKAGE UPDATE
# Use %APPDATA%/mpv/mpv.conf
# OR SVP's menu -> Information -> Add. information -> mpv config. file
#     to define your own customized configuration
#
# Sample mpv configuration
#

# ------------------------------------------------------------------------------
# AUDIO & SOX RESAMPLING
# ------------------------------------------------------------------------------
# Set SoX (libsoxr) as the default software resampler with maximum precision
# This acts as a high-quality fallback if the Lua script bypasses the audio.
audio-swresample-o=cheby=0,out_sample_fmt=dblp,precision=33,resampler=soxr

# option 2 utiluze soxr but add fixed sampling rate due to output hardware limitation
#--audio-swresample-o=cheby=0,out_sample_fmt=fltp,out_sample_rate=48000,precision=28,resampler=soxr

# Maintain correct audio pitch when video speed changes
audio-pitch-correction=yes

# Volume limits & defaults
volume=40
volume-gain-max=113.0
volume-gain-min=-150.0
volume-max=1000.0

# WARNING force fixed Libav filter:
# Do NOT uncomment or hardcode the fixed --af=aresample filter below if you 
# are using the sox_resample.lua script! Let the script handle it dynamically 
# so the HE-AAC codec bypass protection works properly.
#
# --af=aresample=cheby=0:out_sample_fmt=dblp:out_sample_rate=192000:precision=33:resampler=soxr

# ------------------------------------------
# VIDEO & PLAYBACK (Universal High-Quality)
# ------------------------------------------

# this is required for SVP to "catch" the mpv
input-ipc-server=mpvpipe

vo=gpu-next

# Hardware decoding 
# d3d11va & d3d11va-zero-copy is first best for Windows AMD user
#hwdec=dxva2
hwdec=d3d11va
d3d11va-zero-copy=yes

# d3d11va-copy is second best for Windows AMD and Intel user
#hwdec=dxva2-copy
#hwdec=d3d11va-copy
#hwdec=vulkan-copy

# Linux use auto, vaapi, nvdec, drm or vulkan
#hwdec=auto
#hwdec=auto-safe
#hwdec=auto-copy-safe
#hwdec=auto-unsafe
#hwdec=nvdec-copy
#hwdec=vaapi-copy
#hwdec=vulkan-copy

# Smooth playback and audio sync replacement for "ReClock"
video-sync=display-tempo
hr-seek-framedrop=no

# Debanding for better color gradients
deband=yes
deband-iterations=1
deband-threshold=60
deband-range=25
deband-grain=3

# Dithering 
# depth auto or 8 or 10 or 16
dither-depth=auto 

# Use default Dither fruit 
#dither-size-fruit=6
#dither=fruit

# Use Dither error diffusion
dither=error-diffusion
error-diffusion=sierra-lite


# -----------------
# WINDOW & UI
# -----------------
keep-open=yes
loop-playlist=yes
border=no
osd-bar=no
window-corners=donotround

# Automatically apply ICC profile for correct monitor colors
icc-profile-auto=yes
icc-3dlut-size=auto
icc-use-luma=yes

# -----------------------
# CACHE & PERFORMANCE
# -----------------------
demuxer-max-bytes=512MiB
video-reversal-buffer=128MiB
cache-on-disk=no
cache=yes

log-file="~~/mpv/mpv.log.txt"
#log-file="C:\mpv\mpv.log.txt"

# ---------------------------------------------
# EXTERNAL SHADERS (Cross-Platform Path)
# ---------------------------------------------
# Place the downloaded .glsl files inside a "shaders" folder next to your mpv.conf
# Source: https://github.com/hooke007/mpv_PlayKit/tree/main/portable_config/shaders

glsl-shaders="~~/shaders/AMD_FSR1_EASU_luma_RT.glsl"
#glsl-shaders="C:\mpv\shaders\AMD_FSR1_EASU_luma_RT.glsl"
#glsl-shaders="~~/shaders/FastCatmullRom_LUMA.glsl"
#glsl-shaders="C:\mpv\shaders\FastCatmullRom_LUMA.glsl"

# Shader Cache Directory (Cross-Platform)
gpu-shader-cache-dir="~~/shaders"
#gpu-shader-cache-dir="C:\mpv\shaders"
gpu-shader-cache=yes

# Note: You can add more shaders below by repeating the glsl-shaders=... command
# glsl-shaders="~~/shaders/Another_Shader.glsl"

#